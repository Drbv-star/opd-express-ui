<script>
    const API_BASE = "https://opd-express-ai.onrender.com";

    // Utility helper for responsive tap/click handling on mobile
    function bindAction(elementId, callback) {
        const el = document.getElementById(elementId);
        if (!el) return;
        
        const handler = (e) => {
            e.preventDefault();
            callback(e);
        };

        el.addEventListener("click", handler);
        el.addEventListener("touchend", handler);
    }

    // Tab Switcher
    function switchTab(tabId) {
        ['tab1', 'tab2', 'tab3'].forEach(t => {
            const el = document.getElementById(t);
            if (el) el.classList.add('hidden');
        });
        
        ['navTab1', 'navTab2', 'navTab3'].forEach(n => {
            const el = document.getElementById(n);
            if (el) {
                el.classList.remove('active');
                el.classList.add('text-slate-500');
            }
        });

        const targetTab = document.getElementById(tabId);
        if (targetTab) targetTab.classList.remove('hidden');

        const activeNav = tabId === 'tab1' ? 'navTab1' : tabId === 'tab2' ? 'navTab2' : 'navTab3';
        const targetNav = document.getElementById(activeNav);
        if (targetNav) {
            targetNav.classList.add('active');
            targetNav.classList.remove('text-slate-500');
        }
    }

    // Quick Followup Date Shortcuts
    function setFollowup(days) {
        const d = new Date();
        d.setDate(d.getDate() + days);
        document.getElementById("followup_date").value = d.toISOString().split('T')[0];
    }

    // Quick Drug Catalog Select
    document.getElementById("drugCatalog")?.addEventListener("change", (e) => {
        if (!e.target.value) return;
        const p = e.target.value.split(" | ");
        document.getElementById("rx_name").value = p[0] || "";
        document.getElementById("rx_dose").value = p[1] || "";
        document.getElementById("rx_freq").value = p[2] || "BD";
        document.getElementById("rx_duration").value = p[3] || "";
    });

    // 1. Add Drug Button
    bindAction("addRxBtn", () => {
        const name = document.getElementById("rx_name").value.trim();
        const dose = document.getElementById("rx_dose").value.trim();
        const freq = document.getElementById("rx_freq").value;
        const dur = document.getElementById("rx_duration").value.trim();

        if (!name) return alert("Please enter drug name first!");

        const medsBox = document.getElementById("medications");
        medsBox.value += `${name} - ${dose} - ${freq} x ${dur}\n`;

        document.getElementById("rx_name").value = "";
        document.getElementById("rx_dose").value = "";
        document.getElementById("rx_duration").value = "";
    });

    // 2. Mic Recording
    let recognition;
    let isRecording = false;

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-IN';

        bindAction("micBtn", () => {
            const micBtn = document.getElementById("micBtn");
            if (!isRecording) {
                try {
                    recognition.start();
                    isRecording = true;
                    micBtn.innerText = "⏹️ Stop Recording";
                    micBtn.className = "bg-red-600 text-white font-medium text-xs py-2 px-4 rounded-md shadow-sm";
                } catch (err) {
                    console.log("Speech error:", err);
                }
            } else {
                recognition.stop();
                isRecording = false;
                micBtn.innerText = "🎙️ Record Audio Dictation";
                micBtn.className = "bg-indigo-600 text-white font-medium text-xs py-2 px-4 rounded-md shadow-sm";
            }
        });

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                transcript += event.results[i][0].transcript;
            }
            document.getElementById("rawDictation").value = transcript;
        };
    }

    // 3. AI Extract & Auto-Fill Button
    bindAction("aiExtractBtn", async () => {
        const rawText = document.getElementById("rawDictation").value.trim();
        if (!rawText) return alert("Please type or dictate clinical notes first!");

        const btn = document.getElementById("aiExtractBtn");
        btn.innerText = "⏳ Extracting...";
        btn.disabled = true;

        try {
            const res = await fetch(`${API_BASE}/api/v1/ai/process-dictation`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ raw_text: rawText })
            });
            const data = await res.json();

            if (res.ok) {
                if (data.vitals) document.getElementById("v_bp").value = data.vitals;
                if (data.diagnosis) document.getElementById("diagnosis").value = data.diagnosis;
                if (data.soap_note) document.getElementById("soap_note").value = data.soap_note;
                if (data.medications) document.getElementById("medications").value = data.medications;
                if (data.followup_date) document.getElementById("followup_date").value = data.followup_date;
                alert("✨ AI Auto-Fill Complete!");
            } else {
                alert("AI Processing Failed: " + (data.detail || "Error connecting to Gemini"));
            }
        } catch (err) {
            alert("Network Error: " + err.message);
        } finally {
            btn.innerText = "✨ AI Extract & Auto-Fill";
            btn.disabled = false;
        }
    });

    // 4. Save Record Button
    bindAction("saveVisitBtn", async () => {
        const btn = document.getElementById("saveVisitBtn");
        const banner = document.getElementById("successBanner");

        btn.innerText = "⚡ Saving...";
        btn.disabled = true;

        const payload = {
            doctor_id: document.getElementById("doctor_id").value,
            doctor_name: document.getElementById("doctor_name").value,
            doctor_qualification: document.getElementById("doctor_qualification").value,
            hospital_name: document.getElementById("hospital_name").value,
            patient_name: document.getElementById("patient_name").value,
            patient_phone: document.getElementById("patient_phone").value,
            vitals: `BP: ${document.getElementById("v_bp").value}, Pulse: ${document.getElementById("v_pulse").value}`,
            diagnosis: document.getElementById("diagnosis").value,
            soap_note: document.getElementById("soap_note").value,
            medications: document.getElementById("medications").value,
            followup_date: document.getElementById("followup_date").value
        };

        if (!payload.patient_name || !payload.patient_phone) {
            btn.innerText = "⚡ Generate AI SOAP & Save Record";
            btn.disabled = false;
            return alert("Patient Name and Phone Number are required!");
        }

        try {
            const res = await fetch(`${API_BASE}/api/v1/consultations/save`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                banner.classList.remove("hidden");
                banner.innerText = "✅ Consultation Saved Successfully | Patient: " + payload.patient_name;
            } else {
                alert("Database Error: " + (data.detail || "Failed to commit record"));
            }
        } catch (err) {
            alert("Save Error: " + err.message);
        } finally {
            btn.innerText = "⚡ Generate AI SOAP & Save Record";
            btn.disabled = false;
        }
    });

    // 5. Share WhatsApp Button
    bindAction("waBtn", () => {
        const pName = document.getElementById("patient_name").value;
        const pPhone = document.getElementById("patient_phone").value;
        const diagnosis = document.getElementById("diagnosis").value;
        const meds = document.getElementById("medications").value;

        if (!pPhone) return alert("Enter patient phone number!");

        const msg = `🏥 *Primary Health Center*\n👤 *Patient:* ${pName}\n🩺 *Diagnosis:* ${diagnosis}\n\n💊 *Rx:*\n${meds}`;
        window.open(`https://wa.me/91${pPhone.replace(/\D/g, '')}?text=${encodeURIComponent(msg)}`, '_blank');
    });

    // 6. Search Button
    bindAction("searchBtn", async () => {
        const q = document.getElementById("searchQuery").value.trim();
        const docId = document.getElementById("doctor_id").value;
        const container = document.getElementById("searchResults");

        if (!q) return alert("Enter patient name or phone number!");
        container.innerHTML = "<p class='text-xs text-slate-500'>Searching cloud database...</p>";

        try {
            const res = await fetch(`${API_BASE}/api/v1/consultations/search?doctor_id=${docId}&query=${encodeURIComponent(q)}`);
            const data = await res.json();

            if (res.ok && data.data && data.data.length > 0) {
                container.innerHTML = data.data.map(item => `
                    <div class="p-3 border border-slate-200 rounded-lg bg-slate-50 space-y-1">
                        <div class="flex justify-between font-bold text-xs text-slate-800">
                            <span>👤 ${item.patient_name} (${item.patient_phone})</span>
                            <span class="text-slate-500">${new Date(item.created_at).toLocaleDateString()}</span>
                        </div>
                        <p class="text-xs text-slate-600"><strong>Diagnosis:</strong> ${item.diagnosis || 'N/A'}</p>
                        <p class="text-xs text-slate-600"><strong>Vitals:</strong> ${item.vitals || 'N/A'}</p>
                        <p class="text-xs font-mono text-slate-700"><strong>Rx:</strong> ${item.medications || 'N/A'}</p>
                    </div>
                `).join('');
            } else {
                container.innerHTML = "<p class='text-xs text-red-500'>No patient records found matching query.</p>";
            }
        } catch (err) {
            container.innerHTML = "<p class='text-xs text-red-500'>Search failed: " + err.message + "</p>";
        }
    });
            </script>
