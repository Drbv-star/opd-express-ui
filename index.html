<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocScribe EMR Pro</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 font-sans">

    <div class="max-w-3xl mx-auto space-y-6">
        
        <!-- App Header -->
        <header class="flex items-center justify-between bg-slate-800 p-4 rounded-2xl border border-slate-700 shadow-xl">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white text-xl font-bold shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid font-stethoscope"></i>🩺
                </div>
                <div>
                    <h1 class="text-xl font-bold text-white tracking-wide">DocScribe EMR Pro</h1>
                    <p class="text-xs text-slate-400">AI-Powered Cloud Clinical Workspace</p>
                </div>
            </div>
            <div class="flex items-center space-x-2 bg-slate-900/60 px-3 py-1.5 rounded-lg border border-slate-700">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-xs text-slate-300 font-mono">Render API Online</span>
            </div>
        </header>

        <!-- Voice Dictation Studio -->
        <section class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-4">
            <div class="flex justify-between items-center">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                    <i class="fa-solid fa-microphone text-indigo-400"></i> AI Ambient Dictation
                </h2>
                <span id="recordingBadge" class="hidden text-xs bg-red-500/20 text-red-400 border border-red-500/30 px-2.5 py-0.5 rounded-full font-medium animate-pulse">
                    ● Recording Live
                </span>
            </div>

            <textarea id="rawDictation" rows="3" 
                class="w-full bg-slate-900/90 border border-slate-700 rounded-xl p-3.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition text-sm"
                placeholder="Tap 'Start Recording' and speak patient symptoms, vitals, diagnosis, and prescription details naturally..."></textarea>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <button type="button" id="micBtn" 
                    class="w-full bg-slate-700 hover:bg-slate-600 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 transition border border-slate-600 active:scale-[0.99]">
                    <span>🎙️ Start Dictation</span>
                </button>
                <button type="button" id="aiBtn" 
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-4 rounded-xl flex items-center justify-center space-x-2 transition shadow-lg shadow-indigo-600/30 active:scale-[0.99]">
                    <span>✨ AI Process & Auto-Fill</span>
                </button>
            </div>
        </section>

        <!-- Clinical Consultation Form -->
        <form id="emrForm" class="bg-slate-800 rounded-2xl p-5 border border-slate-700 shadow-xl space-y-5">
            
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 flex items-center gap-2">
                <i class="fa-solid fa-notes-medical text-indigo-400"></i> Patient Clinical Record
            </h2>

            <!-- Doctor Metadata -->
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Doctor UUID / Auth Reference</label>
                <input type="text" id="doctor_id" value="1f94aded-5a8b-438e-9eb2-0f533cc14a65" required
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-slate-300 text-xs font-mono focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Patient Demographics -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Patient Name</label>
                    <input type="text" id="patient_name" placeholder="e.g. Ramesh Bhai" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Phone Number</label>
                    <input type="tel" id="patient_phone" placeholder="e.g. 9876543210" required
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- Vitals & Diagnosis -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Vitals</label>
                    <input type="text" id="vitals" placeholder="BP: 120/80, Pulse: 72, Temp: 98.6F"
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Diagnosis</label>
                    <input type="text" id="diagnosis" placeholder="e.g. Acute Gastritis / Hypertension"
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
                </div>
            </div>

            <!-- SOAP Note -->
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">SOAP Clinical Notes</label>
                <textarea id="soap_note" rows="3" placeholder="Subjective complaints, objective observations..."
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500"></textarea>
            </div>

            <!-- Rx Medications -->
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Rx / Prescriptions</label>
                <textarea id="medications" rows="3" placeholder="Tab Pantoprazole 40mg OD x 5 days..."
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500 font-mono"></textarea>
            </div>

            <!-- Follow-up -->
            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Follow-up Date</label>
                <input type="date" id="followup_date"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg p-3 text-slate-200 text-sm focus:outline-none focus:border-indigo-500">
            </div>

            <!-- Submit Button -->
            <button type="submit" id="saveBtn" 
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-emerald-600/30 transition active:scale-[0.99] flex items-center justify-center space-x-2 text-base">
                <span>💾 Commit Record to Supabase EMR</span>
            </button>
        </form>

        <!-- Status Alert Banner -->
        <div id="status" class="hidden p-4 rounded-xl border text-sm font-medium transition"></div>

    </div>

<script>
    const API_BASE = "https://opd-express-ai.onrender.com";

    // Speech Recognition Setup
    let recognition;
    let isRecording = false;
    const micBtn = document.getElementById("micBtn");
    const recordingBadge = document.getElementById("recordingBadge");
    const rawDictation = document.getElementById("rawDictation");

    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-IN';

        micBtn.addEventListener("click", () => {
            if (!isRecording) {
                recognition.start();
                isRecording = true;
                micBtn.innerHTML = "<span>⏹️ Stop Dictation</span>";
                micBtn.className = micBtn.className.replace("bg-slate-700 hover:bg-slate-600", "bg-red-600 hover:bg-red-500");
                recordingBadge.classList.remove("hidden");
            } else {
                recognition.stop();
                isRecording = false;
                micBtn.innerHTML = "<span>🎙️ Start Dictation</span>";
                micBtn.className = micBtn.className.replace("bg-red-600 hover:bg-red-500", "bg-slate-700 hover:bg-slate-600");
                recordingBadge.classList.add("hidden");
            }
        });

        recognition.onresult = (event) => {
            let transcript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                transcript += event.results[i][0].transcript;
            }
            rawDictation.value = transcript;
        };
    } else {
        micBtn.disabled = true;
        micBtn.innerText = "Speech Recognition Not Supported";
    }

    // AI Auto-Extract
    document.getElementById("aiBtn").addEventListener("click", async () => {
        const text = rawDictation.value.trim();
        if (!text) return alert("Please dictate or type text first!");

        const aiBtn = document.getElementById("aiBtn");
        aiBtn.innerHTML = "<span>⏳ Extracting Clinical Notes...</span>";
        aiBtn.disabled = true;

        try {
            const res = await fetch(`${API_BASE}/api/v1/ai/process-dictation`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ raw_text: text })
            });
            const data = await res.json();

            if (res.ok) {
                if (data.vitals) document.getElementById("vitals").value = data.vitals;
                if (data.diagnosis) document.getElementById("diagnosis").value = data.diagnosis;
                if (data.soap_note) document.getElementById("soap_note").value = data.soap_note;
                if (data.medications) document.getElementById("medications").value = data.medications;
                if (data.followup_date) document.getElementById("followup_date").value = data.followup_date;
            } else {
                alert("AI Processing Error: " + (data.detail || "Failed to parse text"));
            }
        } catch (err) {
            alert("Connection Error: " + err.message);
        } finally {
            aiBtn.innerHTML = "<span>✨ AI Process & Auto-Fill</span>";
            aiBtn.disabled = false;
        }
    });

    // Save Consultation
    document.getElementById("emrForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = document.getElementById("saveBtn");
        const status = document.getElementById("status");
        
        btn.innerHTML = "<span>⏳ Transmitting to Cloud...</span>";
        btn.disabled = true;
        status.classList.add("hidden");

        const payload = {
            doctor_id: document.getElementById("doctor_id").value,
            patient_name: document.getElementById("patient_name").value,
            patient_phone: document.getElementById("patient_phone").value,
            vitals: document.getElementById("vitals").value,
            diagnosis: document.getElementById("diagnosis").value,
            soap_note: document.getElementById("soap_note").value,
            medications: document.getElementById("medications").value,
            followup_date: document.getElementById("followup_date").value
        };

        try {
            const res = await fetch(`${API_BASE}/api/v1/consultations/save`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });
            const data = await res.json();

            if (res.ok) {
                status.className = "p-4 rounded-xl border text-sm font-medium bg-emerald-500/10 border-emerald-500/30 text-emerald-400";
                status.innerText = "✅ Successfully Saved to Supabase EMR! (Record ID: " + data.data[0].id + ")";
                status.classList.remove("hidden");
                document.getElementById("emrForm").reset();
                rawDictation.value = "";
                document.getElementById("doctor_id").value = payload.doctor_id;
            } else {
                status.className = "p-4 rounded-xl border text-sm font-medium bg-red-500/10 border-red-500/30 text-red-400";
                status.innerText = "❌ Database Error: " + (data.detail || "Failed to commit record");
                status.classList.remove("hidden");
            }
        } catch (err) {
            status.className = "p-4 rounded-xl border text-sm font-medium bg-red-500/10 border-red-500/30 text-red-400";
            status.innerText = "❌ Network Error: " + err.message;
            status.classList.remove("hidden");
        } finally {
            btn.innerHTML = "<span>💾 Commit Record to Supabase EMR</span>";
            btn.disabled = false;
        }
    });
</script>

</body>
    </html>
