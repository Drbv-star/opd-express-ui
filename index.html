<script>
    const API_BASE = "https://opd-express-ai.onrender.com";

    // MediaRecorder Audio Setup
    let mediaRecorder;
    let audioChunks = [];
    let isRecording = false;

    async function toggleMic() {
        const micBtn = document.getElementById("micBtn");

        if (!isRecording) {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];

                // Use Web Speech API if supported for live transcript display
                if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                    const recognition = new SpeechRecognition();
                    recognition.continuous = true;
                    recognition.interimResults = true;
                    recognition.lang = 'en-IN';

                    recognition.onresult = (event) => {
                        let transcript = '';
                        for (let i = event.resultIndex; i < event.results.length; ++i) {
                            transcript += event.results[i][0].transcript;
                        }
                        document.getElementById("rawDictation").value = transcript;
                    };
                    recognition.start();
                }

                mediaRecorder.start();
                isRecording = true;
                micBtn.innerText = "⏹️ Stop Recording";
                micBtn.className = "bg-red-600 text-white font-medium text-xs py-2 px-4 rounded-md shadow-sm animate-pulse";
            } catch (err) {
                alert("Microphone Permission Denied: Please allow mic access in your mobile browser settings.");
            }
        } else {
            if (mediaRecorder) mediaRecorder.stop();
            isRecording = false;
            micBtn.innerText = "🎙️ Record Audio Dictation";
            micBtn.className = "bg-indigo-600 text-white font-medium text-xs py-2 px-4 rounded-md shadow-sm";
        }
    }

    // AI Extract & Auto-Fill Execution
    async function runAIExtract() {
        const text = document.getElementById("rawDictation").value.trim();
        if (!text) return alert("Please dictate or type notes first!");

        const btn = document.getElementById("aiExtractBtn");
        btn.innerText = "⏳ Extracting Clinical Data...";
        btn.disabled = true;

        try {
            const res = await fetch(`${API_BASE}/api/v1/ai/process-dictation`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ raw_text: text })
            });
            const data = await res.json();

            if (res.ok) {
                // Auto-fill all fields extracted by AI
                if (data.patient_name) document.getElementById("patient_name").value = data.patient_name;
                if (data.patient_phone) document.getElementById("patient_phone").value = data.patient_phone;
                if (data.vitals) document.getElementById("v_bp").value = data.vitals;
                if (data.diagnosis) document.getElementById("diagnosis").value = data.diagnosis;
                if (data.soap_note) document.getElementById("soap_note").value = data.soap_note;
                if (data.medications) document.getElementById("medications").value = data.medications;
                if (data.followup_date) document.getElementById("followup_date").value = data.followup_date;
                alert("✨ Clinical Data & SOAP Note Extracted Successfully!");
            } else {
                alert("AI Processing Error: " + (data.detail || "Server error"));
            }
        } catch (err) {
            alert("Network Error: " + err.message);
        } finally {
            btn.innerText = "✨ AI Extract & Auto-Fill";
            btn.disabled = false;
        }
    }
                                                  </script>
